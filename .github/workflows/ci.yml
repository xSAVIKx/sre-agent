name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a PR branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to exact releases, not floating majors: astral-sh/setup-uv
# stopped publishing a moving major tag after v7, and an exact pin is reproducible
# anyway. The github-actions updater in .github/dependabot.yml keeps them current.

env:
  # Pinned so a uv release cannot change resolution out from under a green build.
  # Keep in step with the `uv==` pin in every Dockerfile.
  UV_VERSION: "0.12.23"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dev tooling
        run: uv sync --all-packages

      - run: uv run ruff check --output-format=github .

      - run: uv run ruff format --check .

      # The workshop's solution patches are derived from the finished code by
      # workshop/build_steps.py. Regenerate them and fail if anything moved, so a
      # change to a step's code cannot silently break the workshop.
      - name: Workshop step patches are up to date
        run: |
          uv run python workshop/build_steps.py
          git diff --exit-code -- workshop/

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, on purpose.
        #
        #   3.11 is the floor every pyproject.toml declares (`requires-python =
        #        ">=3.11"`). Nothing tested it before, and the floor was in fact
        #        broken: `inventory_agent/discovery.py` annotated two functions
        #        with `Any` without importing it, which is a hard NameError on
        #        3.11 and invisible on 3.14 (PEP 649 defers annotations). Either
        #        CI proves the floor or the floor should be raised; this proves it.
        #
        #   3.14 is what actually ships. All four Dockerfiles are FROM
        #        python:3.14-slim, and `uv` resolves the local venv to 3.14 too.
        #
        # Nothing in between is tested, and that is a deliberate cost/benefit call
        # for a demo repo: the two ends catch version-gated syntax and stdlib
        # behaviour, and a five-way matrix would quadruple CI time for very little.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync the workspace
        run: uv sync --all-packages

      # Three suites, run separately: each package uses the src/ + test/ layout,
      # so each needs its own src directory on PYTHONPATH. See AGENTS.md.
      - name: Orchestrator tests
        run: PYTHONPATH=agent/src uv run python -m unittest discover -s agent/test -v

      - name: SRE diagnostics tests
        run: PYTHONPATH=sre_agent/src uv run python -m unittest discover -s sre_agent/test -v

      - name: Workspace import smoke test
        run: uv run python -m unittest discover -s test -v

      # The advertised zero-credentials path in README.md. If this breaks, the
      # first thing a reader tries breaks. simulate_incident.py catches its own
      # exceptions and still exits 0, so grep for the report instead of trusting
      # the exit code.
      - name: Local incident simulation
        shell: bash
        run: |
          uv run python simulate_incident.py | tee simulation.log
          grep -q "Identified Bottleneck" simulation.log
          grep -q "Incident Post-Mortem" simulation.log

  # The one-command installers (INSTALL.md), on a runner of each OS. They run in this
  # checkout, so they test the PR's code. uv is not preinstalled: the installer gets it,
  # as on a new laptop. Then the workshop commands must work on that OS.
  installers:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Windows PowerShell 5.1, the version every Windows computer has.
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Workshop step checks
        run: uv run workshop/check.py all

      - name: Local incident simulation
        shell: bash
        run: |
          uv run simulate_incident.py | tee simulation.log
          grep -q "Identified Bottleneck" simulation.log
          grep -q "Incident Post-Mortem" simulation.log

  a2ui-bundle:
    name: A2UI renderer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The chat UI loads a prebuilt bundle (agent/src/agent/static/sre-a2ui.js), so the
      # service needs no Node toolchain. Rebuild it from the lockfile with the runner's
      # Node and fail if the committed copy is stale. esbuild output is deterministic.
      - name: Rebuild the bundle
        working-directory: agent/web
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run build

      - name: Committed bundle is up to date
        run: git diff --exit-code -- agent/src/agent/static/

  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Builds the shared base and all four service images exactly as
      # docker-compose does, so a broken Dockerfile fails the PR instead of the
      # next deploy. Nothing is pushed.
      - name: Build every image
        run: docker compose build
