name: Docs

# The workshop website: https://xsavikx.github.io/sre-agent/
# Each PR builds it in strict mode (a broken link or anchor fails). Master also
# publishes it to GitHub Pages. scripts/build_docs.py has the pinned MkDocs versions.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with UV_VERSION in ci.yml.
  UV_VERSION: "0.12.23"

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build (strict)
        run: uv run --no-project python scripts/build_docs.py

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
