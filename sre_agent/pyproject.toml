[project]
name = "sre-sub-agent"
version = "0.1.0"
description = "Antigravity Cloud SRE Diagnostics Agent Service"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.1.20,<0.2",
    # The a2a extra brings ADK's A2A server/client (to_a2a, RemoteA2aAgent).
    "google-adk[a2a]>=2.11.0,<3",
    "a2a-sdk[http-server]>=1.2.1,<2",
    "google-genai>=2.28.0,<3",
    "google-cloud-trace>=1.20.0",
    "google-cloud-logging>=3.16.2",
    "google-cloud-monitoring>=2.31.0",
    "google-cloud-firestore>=2.28.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    # A floor only. google-adk 2.11.x already caps this at <=1.42.1; restating the
    # cap here just gives Dependabot's `increase` strategy something to turn into
    # an unsatisfiable `>=1.43.0,<=1.42.1`, and hides the day adk lifts it.
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "sre-common",
]

[tool.uv.sources]
sre-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
