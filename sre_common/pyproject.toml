[project]
name = "sre-common"
version = "0.1.0"
description = "Shared common utilities for SRE multi-agent workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    # sre_common.a2a_client: the Agent2Agent protocol client the agents share.
    "a2a-sdk>=1.2.1,<2",
    # sre_common.tracing: spans for incoming requests and outgoing httpx calls (A2A,
    # Gemini), exported to Cloud Trace. 0.63b1 is the newest line compatible with the
    # opentelemetry-sdk version google-adk allows.
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "uvicorn>=0.52.4",
    # A floor, not a pin: this library declares no google-adk dependency. The
    # <=1.42.1 ceiling belongs to adk and arrives transitively, in the two members
    # that actually depend on it.
    "opentelemetry-sdk>=1.42.1",
    "google-cloud-logging>=3.16.2",
    "google-cloud-trace>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
